name: 'WordPress Plugin Check'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
    - main
    - 'releases/*'

jobs:
  test:
    name: 'Run WordPress Plugin Check'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build readme.txt
      # readme.txt is generated from README.md and not committed.
      run: node bin/build-readme.mjs

    - name: Run plugin check
      uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
      with:
        # The WordPress.org slug, it differs from the repository name.
        slug: code-bin
        exclude-directories: ".github,bin,tests"
        # Files not included in releases, see .gitattributes.
        exclude-files: ".editorconfig,.gitattributes,.gitignore,.nvmrc,.wordpress-version-checker.json,phpcs.xml.dist,phpunit.xml.dist,README.md,RELEASE.md"
