name: Plugin asset/readme update
on:
  push:
    branches:
    - main
jobs:
  update_assets:
    # Disable workflow until release on WordPress.org
    if: false
    name: Push asset update to WordPress.org
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Subversion.
      run: |
        # Check if SVN is installed, if not install it.
        if ! command -v svn &> /dev/null
        then
            sudo apt-get update -y
            sudo apt-get install -y subversion
        fi

    - name: Create .wordpress-org directory if it doesn't exist.
      run: mkdir -p .wordpress-org

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund --ignore-scripts

    - name: Build assets
      run: npm run build

    - name: Commit build and remove README.md and composer.json from WordPress.org deploy.
      run: |
        # The 10up action uses `git archive` so the gitignored build and readme.txt must be committed.
        git add -f build/ readme.txt
        git rm README.md composer.json
        git config --global user.email "10upbot+github@10up.com"
        git config --global user.name "10upbot on GitHub"
        git commit -m "Build for WordPress.org deploy"

    - name: WordPress.org plugin asset/readme update
      uses: 10up/action-wordpress-plugin-asset-update@2480306f6f693672726d08b5917ea114cb2825f7 # 2.2.0
      env:
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
