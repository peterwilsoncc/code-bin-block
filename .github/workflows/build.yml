# Build a release.
#
# Based on the release process used by Query Monitor:
# https://github.com/johnbillion/plugin-infrastructure/blob/trunk/.github/workflows/reusable-build.yml
#
# Pushing to the `release` branch builds the plugin's assets, commits them to a
# `release-X.Y.Z` branch, tags that commit `X.Y.Z` and creates a draft release.
# The built files never touch `main`, but are included in the tag for Composer
# (via Packagist) and WordPress.org. Publishing the draft release deploys it to
# WordPress.org via the wporg-deploy.yml workflow.

name: Build
on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to push release branch and tags
    timeout-minutes: 10
    env:
      # Tag and create a release on push, build only when run manually.
      TAG: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: true

    - name: Setup version
      run: echo VERSION="$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

    - name: Check for open issues in the milestone
      run: | #shell
        open_issues=$(gh issue list --search "milestone:\"${VERSION}\"" --state open --json number | jq '. | length')
        if [ "$open_issues" -gt 0 ]; then
          echo "There are open issues remaining in the ${VERSION} milestone"
          echo "https://github.com/${GITHUB_REPOSITORY}/milestones"
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Check for open PRs in the milestone
      run: | #shell
        open_prs=$(gh pr list --search "milestone:\"${VERSION}\"" --state open --json number | jq '. | length')
        if [ "$open_prs" -gt 0 ]; then
          echo "There are open PRs remaining in the ${VERSION} milestone"
          echo "https://github.com/${GITHUB_REPOSITORY}/milestones"
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'

    - name: Install Dependencies
      run: npm ci --no-audit --no-fund --ignore-scripts

    - name: Build Assets
      run: | #shell
        npm run build
        git add -f build/ readme.txt

    - name: Commit
      run: | #shell
        echo 'Committing ...'
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "release-${VERSION}"
        git commit -m "Release ${VERSION}"
        git push origin -f "release-${VERSION}"

    - name: Tag
      if: ${{ env.TAG == 'true' }}
      run: | #shell
        echo "Releasing version ${VERSION} ..."
        git tag "${VERSION}"
        git push --tags

    - name: Create release
      if: ${{ env.TAG == 'true' }}
      run: | #shell
        gh release create "${VERSION}" --title "${VERSION}" --draft
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Create zip file
      if: always()
      id: create-zip
      run: git archive --format=zip --output=build.zip HEAD

    - name: Upload zip
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build
        path: build.zip
        if-no-files-found: error
        archive: false
      if: always() && steps.create-zip.outcome == 'success'
