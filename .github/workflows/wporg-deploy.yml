name: Deploy to WordPress.org Repository

on:
  release:
    types: [released]

jobs:
  deploy_to_wp_repository:
    # Disable workflow until release on WordPress.org
    if: false
    name: Deploy to WP.org
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Subversion.
      run: |
        # Check if SVN is installed, if not install it.
        if ! command -v svn &> /dev/null
        then
            sudo apt-get update -y
            sudo apt-get install -y subversion
        fi

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: '.nvmrc'

    - name: Install dependencies
      run: npm ci --no-audit --no-fund --ignore-scripts

    - name: Build assets
      run: npm run build

    - name: Commit build and remove README.md and composer.json from WordPress.org deploy.
      run: |
        # The 10up action uses `git archive` so the gitignored build and readme.txt must be committed.
        git add -f build/ readme.txt
        git rm README.md composer.json
        git config --global user.email "10upbot+github@10up.com"
        git config --global user.name "10upbot on GitHub"
        git commit -m "Build for WordPress.org deploy"

    - name: Create .wordpress-org directory if it doesn't exist.
      run: mkdir -p .wordpress-org

    - name: WordPress Plugin Deploy
      id: deploy
      uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
      with:
        generate-zip: true

      env:
        SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

    - name: Upload release asset
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ${{ steps.deploy.outputs.zip-path }}
